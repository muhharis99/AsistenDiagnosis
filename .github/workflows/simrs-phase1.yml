name: SIMRS Platform checks

on:
  push:
    branches:
      - main
      - "feat/fase-1-foundation-20261026"
      - "feat/fase-2-frontoffice-cashier-20261026"
      - "feat/fase-3-clinical-core-20261026"
      - "feat/fase-4-payer-claims-20261026"
    paths:
      - "simrs_platform/**"
      - ".github/workflows/simrs-phase1.yml"
  pull_request:
    branches:
      - main
    paths:
      - "simrs_platform/**"
      - ".github/workflows/simrs-phase1.yml"

permissions:
  contents: write

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simrs_platform
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Resolve lockfile and migrations
        run: |
          set -e
          uv lock
          uv sync --all-groups
          uv run ruff check . --fix
          uv run ruff format .
          uv run python manage.py makemigrations organization identity terminology mpi platform_core frontoffice cashier clinical orders pharmacy diagnostics adt payer claims receivables
          uv run ruff check . --fix
          uv run ruff format .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ "$GITHUB_EVENT_NAME" = "push" ] && ! git diff --cached --quiet; then
            git commit -m "build(simrs): lock dependencies and add migrations"
            BRANCH="$GITHUB_REF_NAME"
            git push origin "HEAD:$BRANCH"
          fi
      - name: Django system checks
        run: uv run python manage.py check
      - name: Database migrations
        run: uv run python manage.py migrate --noinput
      - name: Test suite
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .
      - name: Compile
        run: uv run python -m compileall -q config organization identity terminology mpi platform_core frontoffice cashier clinical orders pharmacy diagnostics adt payer claims receivables

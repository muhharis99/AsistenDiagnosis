name: RME Phase 1 checks
on:
  push:
    branches: [main, feat/fase-1-rme-foundation]
  pull_request:
    branches: [main]
    paths:
      - "rme/**"
      - "rme_app.py"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/rme-phase1.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q rme rme_app.py scripts tests
      - run: pytest -q
